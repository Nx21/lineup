<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 1050" width="680" height="1050">
  <!-- Background -->
  <rect width="680" height="1050" fill="#228022"/>

  <!-- Pitch outline -->
  <rect x="20" y="20" width="640" height="1010" fill="none" stroke="white" stroke-width="2.5"/>

  <!-- Centre line -->
  <line x1="20" y1="525" x2="660" y2="525" stroke="white" stroke-width="2.5"/>

  <!-- Centre circle -->
  <circle cx="340" cy="525" r="60" fill="none" stroke="white" stroke-width="2.5"/>
  <circle cx="340" cy="525" r="4" fill="white"/>

  <!-- Top penalty area -->
  <rect x="150" y="20" width="380" height="104" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Top goal area -->
  <rect x="245" y="20" width="190" height="40" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Top goal -->
  <rect x="291" y="8" width="98" height="14" fill="none" stroke="white" stroke-width="2"/>
  <!-- Top penalty spot -->
  <circle cx="340" cy="92" r="3.5" fill="white"/>
  <!-- Top penalty arc -->
  <path d="M 280 124 A 60 60 0 0 1 400 124" fill="none" stroke="white" stroke-width="2.5"/>

  <!-- Bottom penalty area -->
  <rect x="150" y="926" width="380" height="104" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Bottom goal area -->
  <rect x="245" y="990" width="190" height="40" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Bottom goal -->
  <rect x="291" y="1028" width="98" height="14" fill="none" stroke="white" stroke-width="2"/>
  <!-- Bottom penalty spot -->
  <circle cx="340" cy="958" r="3.5" fill="white"/>
  <!-- Bottom penalty arc -->
  <path d="M 280 926 A 60 60 0 0 0 400 926" fill="none" stroke="white" stroke-width="2.5"/>

  <!-- Corner arcs -->
  <path d="M 20 30 A 10 10 0 0 1 30 20"  fill="none" stroke="white" stroke-width="2"/>
  <path d="M 650 20 A 10 10 0 0 1 660 30" fill="none" stroke="white" stroke-width="2"/>
  <path d="M 20 1020 A 10 10 0 0 0 30 1030" fill="none" stroke="white" stroke-width="2"/>
  <path d="M 660 1020 A 10 10 0 0 1 650 1030" fill="none" stroke="white" stroke-width="2"/>
</svg>
